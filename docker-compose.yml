services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATA_PATH: /data/flights.json
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./flights.json:/data/flights.json:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - backend
